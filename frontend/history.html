<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GuardBuy - History</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
min-height:100vh;
background:
radial-gradient(circle at 15% 10%, rgba(46,168,123,0.08), transparent 40%),
radial-gradient(circle at 85% 90%, rgba(27,169,127,0.06), transparent 45%),
linear-gradient(180deg,#f7fbf9 0%,#eef3f1 100%);
color:#0f172a;
}

.page{
min-height:100vh;
display:flex;
flex-direction:column;
}

.topbar{
display:flex;
align-items:center;
justify-content:center;
position:relative;
padding:28px 40px;
}

.back-btn{
position:absolute;
left:30px;
width:56px;
height:56px;
border-radius:50%;
background:#dff1ea;
display:flex;
align-items:center;
justify-content:center;
font-size:22px;
cursor:pointer;
}

.delete-all{
position:absolute;
right:30px;
width:56px;
height:56px;
border-radius:50%;
background:white;
display:flex;
align-items:center;
justify-content:center;
box-shadow:0 8px 16px rgba(0,0,0,0.12);
font-size:18px;
cursor:pointer;
color:#DC2626;
font-weight:900;
}

.page-title{
font-size:24px;
font-weight:900;
}

.history-list{
padding:20px 20px 120px;
display:flex;
flex-direction:column;
gap:20px;
}

.history-card{
background:white;
border-radius:24px;
padding:20px;
display:flex;
gap:18px;
align-items:center;
box-shadow:0 14px 30px rgba(0,0,0,0.06);
}

.history-img{
width:80px;
height:80px;
border-radius:20px;
object-fit:cover;
}

.history-content{
flex:1;
display:flex;
flex-direction:column;
gap:6px;
}

.history-name{
font-size:18px;
font-weight:800;
}

.history-risk{
font-size:14px;
font-weight:600;
}

.empty{
text-align:center;
margin-top:60px;
color:#94a3b8;
}

.bottom-nav{
margin:40px auto 30px;
background:white;
border-radius:30px;
padding:18px;
display:flex;
justify-content:space-around;
box-shadow:0 18px 34px rgba(0,0,0,0.12);
width:90%;
max-width:520px;
}

.nav-item{
text-align:center;
font-size:15px;
color:#94a3b8;
cursor:pointer;
}

.nav-item.active{
color:#2ea87b;
font-weight:900;
}

@media(max-width:600px){
.back-btn{ left:18px; }
.delete-all{ right:18px; }
}
</style>
</head>

<body>

<div class="page">

<div class="topbar">
<div class="back-btn" onclick="window.location.href='index.html'">←</div>
<div class="page-title">Purchase History</div>
<div class="delete-all" onclick="clearAll()">DEL</div>
</div>

<div id="historyList" class="history-list"></div>

<div id="emptyState" class="empty" style="display:none;">
No analysis yet. Start analyzing products to see history.
</div>

<div class="bottom-nav">
<div class="nav-item" onclick="window.location.href='index.html'">Home</div>
<div class="nav-item active">History</div>
<div class="nav-item" onclick="window.location.href='about.html'">About</div>
</div>

</div>

<script>

async function loadHistory(){

try{

const res = await fetch("/history");

if(!res.ok){
document.getElementById("emptyState").style.display="block";
return;
}

const data = await res.json();

const container = document.getElementById("historyList");
const empty = document.getElementById("emptyState");

container.innerHTML = "";

if(!data || data.length === 0){
empty.style.display="block";
return;
}

empty.style.display="none";

data.forEach(item=>{

let riskColor = "#27AE82";
if(item.regret_percentage >= 60) riskColor="#DC2626";
else if(item.regret_percentage >= 30) riskColor="#F59E0B";

container.innerHTML += `
<div class="history-card">
<img class="history-img"
src="${item.product_image || 'https://via.placeholder.com/100'}">

<div class="history-content">
<div class="history-name">
${item.product_name}
</div>

<div class="history-risk" style="color:${riskColor}">
${item.regret_percentage}% Risk — ${item.recommendation}
</div>
</div>
</div>
`;
});

}catch(error){
console.error("History load error:", error);
document.getElementById("emptyState").style.display="block";
}

}

async function clearAll(){

const confirmDelete = confirm("Delete all history?");
if(!confirmDelete) return;

try{
await fetch("/history/clear",{ method:"DELETE" });
loadHistory();
}catch(e){
alert("Delete endpoint not available.");
}

}

loadHistory();

</script>

</body>
</html>
