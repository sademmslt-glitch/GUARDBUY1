<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GuardBuy - Full Report</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Inter',sans-serif;
}

body{
background:#f2f4f3;
min-height:100vh;
display:flex;
justify-content:center;
}

.app{
width:100%;
max-width:820px;
background:#f6f7f6;
min-height:100vh;
padding:30px 22px 120px;
}

/* ===== TOP BAR ===== */

.topbar{
display:flex;
align-items:center;
justify-content:center;
position:relative;
margin-bottom:30px;
}

.title{
font-size:22px;
font-weight:700;
color:#1f2937;
}

.icon-btn{
position:absolute;
width:46px;
height:46px;
border-radius:50%;
background:#eef1ef;
display:flex;
align-items:center;
justify-content:center;
cursor:pointer;
font-size:18px;
box-shadow:0 6px 14px rgba(0,0,0,0.06);
transition:.2s;
}

.icon-btn:first-child{ left:0; }
.icon-btn:last-child{ right:0; }

.icon-btn:hover{
transform:translateY(-2px);
}

/* ===== CLEAN PRODUCT CARD ===== */

.product-card{
background:white;
border-radius:26px;
overflow:hidden;
box-shadow:0 15px 30px rgba(0,0,0,0.08);
margin-bottom:20px;
}

.product-card img{
width:100%;
height:220px;
object-fit:contain;
background:#f3f4f6;
display:block;
padding:18px;
border-radius:18px;
border:1px solid rgba(0,0,0,0.05);
box-shadow:0 10px 25px rgba(0,0,0,0.08);
}

.product-name{
padding:20px;
font-size:18px;
font-weight:700;
color:#111827;
line-height:1.4;
}

/* ===== SECTIONS ===== */

.section{
background:white;
border-radius:22px;
padding:22px;
margin-bottom:22px;
box-shadow:0 12px 25px rgba(0,0,0,0.06);
}

.section h3{
font-size:17px;
font-weight:700;
margin-bottom:14px;
}

.section ul{
padding-left:18px;
}

.section li{
margin-bottom:10px;
font-size:15px;
line-height:1.6;
color:#374151;
}

.negative{
border-left:6px solid #ef4444;
}

.positive{
border-left:6px solid #10b981;
}

/* ===== BUTTONS ===== */

.cta-primary{
margin-top:10px;
background:linear-gradient(90deg,#2ea87b,#1f7a5c);
color:white;
border:none;
width:100%;
padding:18px;
border-radius:30px;
font-size:16px;
font-weight:700;
cursor:pointer;
box-shadow:0 15px 35px rgba(31,122,92,0.3);
}

.cta-secondary{
margin-top:14px;
background:#e5e7eb;
color:#111827;
border:none;
width:100%;
padding:16px;
border-radius:30px;
font-size:15px;
font-weight:600;
cursor:pointer;
}

@media(max-width:600px){
.product-card img{ height:200px; }
.title{ font-size:18px; }
}

@media(min-width:1200px){
.app{
max-width:900px;
padding:40px 40px 140px;
}
.product-card img{ height:320px; }
}

</style>
</head>

<body>

<div class="app">

<div class="topbar">
<div class="icon-btn" onclick="goBack()">←</div>
<div class="title">Review Insights</div>
<div class="icon-btn" onclick="shareReport()">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#1f2937" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
<circle cx="18" cy="5" r="3"></circle>
<circle cx="6" cy="12" r="3"></circle>
<circle cx="18" cy="19" r="3"></circle>
<line x1="8.7" y1="13.5" x2="15.3" y2="17.5"></line>
<line x1="15.3" y1="6.5" x2="8.7" y2="10.5"></line>
</svg>
</div>
</div>

<div class="product-card">
<img id="productImage" src="">
<div id="productName" class="product-name"></div>
</div>

<div class="section negative">
<h3>Most Common Negative Experiences</h3>
<ul id="negativeReviews"></ul>
</div>

<div class="section positive">
<h3>Most Common Positive Experiences</h3>
<ul id="positiveReviews"></ul>
</div>

<button class="cta-primary" onclick="continueShopping()">
Continue to Shopping →
</button>

<button class="cta-secondary" onclick="analyzeAnother()">
Analyze Another Product
</button>

</div>

<script>

const result = JSON.parse(localStorage.getItem("analysisResult"));

if(!result){
window.location.href="home.html";
}

document.getElementById("productName").innerText = result.product.name;
document.getElementById("productImage").src =
result.product.image || "https://via.placeholder.com/400";

function createItem(text){
const li = document.createElement("li");
li.innerText = text;
return li;
}

/* ===== UPDATED LOGIC (NO DELETION, JUST SMART DISPLAY) ===== */

if(result.evidence){

const negativeContainer = document.getElementById("negativeReviews");
const positiveContainer = document.getElementById("positiveReviews");

const negatives = result.evidence.top_negative || [];
const positives = result.evidence.top_positive || [];

/* NEGATIVES */
if(negatives.length === 0){
negativeContainer.appendChild(
createItem("No strong negative experiences detected for this product.")
);
}else{
negatives.slice(0,2).forEach(r=>{
negativeContainer.appendChild(createItem(r));
});
}

/* POSITIVES */
if(positives.length === 0){
positiveContainer.appendChild(
createItem("No strong positive highlights available.")
);
}else{
positives.slice(0,2).forEach(r=>{
positiveContainer.appendChild(createItem(r));
});
}

}

function goBack(){
window.location.href="result.html";
}

function analyzeAnother(){
window.location.href="home.html";
}

function continueShopping(){

if(result && result.product && result.product.asin){

const asin = result.product.asin;
const amazonLink = "https://www.amazon.com/dp/" + asin;

window.open(amazonLink,"_blank");

}else{
alert("Product link not available");
}
}

function shareReport(){
if(navigator.share){
navigator.share({
title:"GuardBuy Analysis",
text:"Check this product risk analysis",
url: window.location.href
});
}else{
navigator.clipboard.writeText(window.location.href);
alert("Link copied to clipboard");
}
}

</script>

</body>
</html>
